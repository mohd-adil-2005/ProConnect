services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
  backend:
    build: ./backend
    ports:
      - "5050:5050"
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://adil:adil@mongo:27017/socialApp    
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: adil
      MONGO_INITDB_ROOT_PASSWORD: adil
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: 
  driver:local
  mongo-exoress:
    image: mongo-express:latest
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: adil
      ME_CONFIG_MONGODB_ADMINPASSWORD: adil
      ME_CONFIG_MONGODB_URL: mongodb://adil:adil@mongo:27017/socialApp
      